# Example Environment Configuration for Spring Boot Backend
spring.application.name=placement-management-system
server.port=8080

# Database Configuration (MySQL)
# Set your environment variables or replace these placeholders
spring.datasource.url=jdbc:mysql://localhost:3306/placement_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=your_mysql_password_here
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate auto table management
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
