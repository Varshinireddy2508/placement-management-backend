# Application Configuration
spring.application.name=placement-management-system
server.port=8080

# MySQL Database Configuration
# The createDatabaseIfNotExist flag automatically creates the database in MySQL if it doesn't already exist.
spring.datasource.url=jdbc:mysql://localhost:3306/placement_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Do not run raw SQL scripts automatically; let Hibernate DDL auto-create/update tables
spring.sql.init.mode=never

# Sensible logging
logging.level.org.springframework.web=INFO
logging.level.com.placement=DEBUG
